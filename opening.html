<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEM IBNU SINA | Ksatria Avicenna</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #050505;
            --accent-ember: #ff5500;
            --text-main: #f3f3f5;
            --text-muted: #888890;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Ember Silhouette */
        body::before {
            content: '';
            position: absolute;
            top: -20vh;
            right: -20vw;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(255, 85, 0, 0.1) 0%, rgba(5, 5, 5, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .opening-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: 900px;
            width: 100%;
            padding: 0 3rem;
        }

        @media(max-width: 768px) {
            .opening-wrapper {
                padding: 0 1.5rem;
                align-items: center;
                text-align: center;
            }
        }

        /* Minimal Logo Reveal */
        .opening-logo {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #222;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-ember);
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(20px);
            animation: cubicReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
            overflow: hidden;
        }

        .opening-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Kinetic Staggered Title */
        .opening-title {
            font-size: clamp(2.5rem, 6vw, 5.5rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.05;
            color: #fff;
            margin-bottom: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.25em;
        }

        .word {
            display: inline-flex;
            overflow: hidden;
        }

        .char {
            display: inline-block;
            opacity: 0;
            transform: translateY(60px);
            animation: charReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Stagger Delays calculated per character */
        .char:nth-child(1)  { animation-delay: 0.4s; }
        .char:nth-child(2)  { animation-delay: 0.45s; }
        .char:nth-child(3)  { animation-delay: 0.5s; }
        .char:nth-child(4)  { animation-delay: 0.55s; }
        .char:nth-child(5)  { animation-delay: 0.6s; }
        .char:nth-child(6)  { animation-delay: 0.65s; }
        .char:nth-child(7)  { animation-delay: 0.7s; }
        .char:nth-child(8)  { animation-delay: 0.75s; }
        .char:nth-child(9)  { animation-delay: 0.8s; }
        .char:nth-child(10) { animation-delay: 0.85s; }
        .char:nth-child(11) { animation-delay: 0.9s; }
        .char:nth-child(12) { animation-delay: 0.95s; }

        .highlight {
            color: var(--accent-ember);
        }

        @keyframes charReveal {
            0% { opacity: 0; transform: translateY(60px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes cubicReveal {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Subtitle */
        .opening-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
            opacity: 0;
            transform: translateY(20px);
            animation: cubicReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
        }

        /* Action link */
        .opening-action {
            opacity: 0;
            transform: translateY(20px);
            animation: cubicReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.4s forwards;
        }

        .btn-enter {
            background: transparent;
            border: 1px solid var(--accent-ember);
            color: #fff;
            padding: 0.9rem 2.2rem;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-enter:hover {
            background: var(--accent-ember);
            border-color: var(--accent-ember);
            padding-left: 2.6rem;
            padding-right: 2.6rem;
        }

        /* Progress / Timer bar at bottom */
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 2px;
            background: var(--accent-ember);
            width: 0%;
            animation: loadProgress 4.5s linear 1.5s forwards;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Curtain Transition Overlay */
        .transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-base);
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .transition-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
    </style>
</head>
<body>

    <div class="transition-overlay" id="overlay"></div>

    <div class="opening-wrapper">
        <div class="opening-logo">
            <img src="logobem-removebg-preview.png" alt="Logo">
            <i class="fa-solid fa-shield-halved" style="position:absolute;"></i>
        </div>

        <h1 class="opening-title">
            <span class="word">
                <span class="char">B</span><span class="char">E</span><span class="char">M</span>
            </span>
            <span class="word">
                <span class="char">I</span><span class="char">B</span><span class="char">N</span><span class="char">U</span>
            </span>
            <span class="word">
                <span class="char">S</span><span class="char">I</span><span class="char">N</span><span class="char">A</span>
            </span>
        </h1>

        <div class="opening-subtitle">Kabinet Ksatria Avicenna</div>

        <div class="opening-action">
            <a href="index.html" class="btn-enter" id="enterBtn">
                Eksplorasi Ruang <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>
    </div>

    <div class="progress-bar"></div>

    <script>
        const enterBtn = document.getElementById('enterBtn');
        const overlay = document.getElementById('overlay');

        function goToMain(e) {
            if (e) e.preventDefault();
            overlay.classList.add('active');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 600);
        }

        enterBtn.addEventListener('click', goToMain);

        // Auto redirect after progress bar completes (~6 seconds total)
        setTimeout(() => {
            goToMain();
        }, 6000);
    </script>
</body>
</html>
